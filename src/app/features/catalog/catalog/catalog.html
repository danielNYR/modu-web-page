<moldhea-page-header
  title="Catálogo"
  subtitle="Productos, planes y módulos que arman las licencias de Moldhea"
/>

<div hlmTabs [tab]="activeTab()" (tabActivated)="selectTab($event)">
  <div hlmTabsList>
    <button hlmTabsTrigger="productos">Productos</button>
    <button hlmTabsTrigger="planes">Planes</button>
    <button hlmTabsTrigger="modulos">Módulos</button>
    <button hlmTabsTrigger="paquetes">Paquetes</button>
    <button hlmTabsTrigger="descuentos">Descuentos</button>
    <button hlmTabsTrigger="periodos-licencia">Licencias</button>
  </div>

  <div hlmTabsContent="productos">
    <div hlmCard>
      <moldhea-products-panel />
    </div>
  </div>

  <div hlmTabsContent="planes">
    <div hlmCard>
      <moldhea-plans-panel />
    </div>
  </div>

  <div hlmTabsContent="modulos">
    <div hlmCard>
      <moldhea-modules-panel />
    </div>
  </div>

  <div hlmTabsContent="paquetes">
    <div hlmCard>
      <moldhea-packages-panel />
    </div>
  </div>

  <div hlmTabsContent="descuentos">
    <div hlmCard>
      <moldhea-descuentos-panel />
    </div>
  </div>

  <div hlmTabsContent="periodos-licencia">
    <div hlmCard>
      <moldhea-periodos-licencia-panel />
    </div>
  </div>
</div>
