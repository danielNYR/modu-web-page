<aside class="flex h-full w-64 shrink-0 flex-col bg-sidebar text-sidebar-foreground">
  <div class="flex items-center gap-3 px-6 py-6">
    <div class="grid grid-cols-2 gap-0.5 overflow-hidden rounded-lg shadow-lg">
      <span class="h-4 w-4 bg-moldhea-400"></span>
      <span class="h-4 w-4 bg-moldhea-500"></span>
      <span class="h-4 w-4 bg-moldhea-600"></span>
      <span class="h-4 w-4 bg-moldhea-700"></span>
    </div>
    <div class="leading-tight">
      <p class="text-sm font-semibold tracking-tight">Moldhea</p>
      <p class="text-xs text-sidebar-foreground/60">Accounts</p>
    </div>
  </div>

  <nav class="flex-1 space-y-1 px-3">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-sidebar-accent text-white"
        class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-sidebar-foreground/70 transition-colors hover:bg-sidebar-accent hover:text-white"
      >
        <ng-icon [name]="item.icon" size="18" />
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="border-t border-sidebar-border px-3 py-4">
    <button
      type="button"
      (click)="logout()"
      class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-sidebar-foreground/70 transition-colors hover:bg-sidebar-accent hover:text-white"
    >
      <ng-icon name="lucideLogOut" size="18" />
      Cerrar sesión
    </button>
  </div>
</aside>
