<header
  class="flex h-16 shrink-0 items-center justify-between border-b border-border bg-background px-6"
>
  <label
    class="flex w-full max-w-sm items-center gap-2 rounded-md border border-input bg-transparent px-3 py-1.5 text-sm text-muted-foreground focus-within:border-ring focus-within:ring-3 focus-within:ring-ring/50"
  >
    <ng-icon name="lucideSearch" size="16" />
    <input
      type="search"
      placeholder="Buscar clientes, licencias…"
      class="w-full bg-transparent outline-none placeholder:text-muted-foreground"
    />
  </label>

  <div class="flex items-center gap-4">
    <button
      type="button"
      class="relative flex size-9 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"
    >
      <ng-icon name="lucideBell" size="18" />
      <span class="absolute top-2 right-2 size-1.5 rounded-full bg-moldhea-500"></span>
    </button>

    <div class="flex items-center gap-3">
      <hlm-avatar size="sm">
        <span hlmAvatarFallback class="bg-moldhea-100 text-moldhea-700">MA</span>
      </hlm-avatar>
      <div class="hidden text-sm leading-tight sm:block">
        <p class="font-medium">Equipo Moldhea</p>
        <p class="text-xs text-muted-foreground">admin&#64;moldhea.com</p>
      </div>
    </div>
  </div>
</header>
