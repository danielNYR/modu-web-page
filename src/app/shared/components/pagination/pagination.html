<div class="flex items-center justify-between border-t border-border px-4 py-3 text-sm text-muted-foreground">
  <p>
    Página {{ page() + 1 }} de {{ totalPages() || 1 }}
    @if (totalElements() !== undefined) {
      · {{ totalElements() }} resultados
    }
  </p>

  <div class="flex items-center gap-2">
    <button
      type="button"
      (click)="previous()"
      [disabled]="first()"
      class="flex size-8 items-center justify-center rounded-md border border-input transition-colors hover:bg-muted disabled:pointer-events-none disabled:opacity-40"
    >
      <ng-icon name="lucideChevronLeft" size="16" />
    </button>
    <div class="hidden items-center gap-1 sm:flex">
      @for (pageNumber of visiblePages(); track pageNumber) {
        <button
          type="button"
          (click)="goTo(pageNumber)"
          [attr.aria-current]="pageNumber === page() ? 'page' : null"
          [class]="pageNumber === page()
            ? 'flex size-8 items-center justify-center rounded-md bg-moldhea-600 font-medium text-white'
            : 'flex size-8 items-center justify-center rounded-md border border-input transition-colors hover:bg-muted'"
        >
          {{ pageNumber + 1 }}
        </button>
      }
    </div>
    <button
      type="button"
      (click)="next()"
      [disabled]="last()"
      class="flex size-8 items-center justify-center rounded-md border border-input transition-colors hover:bg-muted disabled:pointer-events-none disabled:opacity-40"
    >
      <ng-icon name="lucideChevronRight" size="16" />
    </button>
  </div>
</div>
